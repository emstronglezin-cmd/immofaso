services:
  - type: web
    name: immofaso-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: immofaso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: UPLOADS_DIR
        value: uploads
      - key: LEEKPAY_ENABLED
        value: "true"
      - key: LEEKPAY_PUBLIC_KEY
        sync: false
      - key: LEEKPAY_SECRET_KEY
        sync: false
      - key: LEEKPAY_API_URL
        value: https://leekpay.fr/api/v1
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_AUTH_KEY
        sync: false
      - key: WHATSAPP_API_URL
        value: https://api-whatsappotp.total-innovation.net/v1/otp/send

databases:
  - name: immofaso-db
    plan: free
